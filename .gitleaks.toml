title = "gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Falsos positivos conhecidos do projeto"
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)package-lock\.json$''',
  '''(^|/)pnpm-lock\.yaml$''',
  '''(^|/)yarn\.lock$''',
  '''(^|/)\.env\.example$''',
  '''(^|/)exemple\.env$''',
  '''(^|/)tests?/''',
  '''(^|/)scripts/''',
  '''(^|/)docs/''',
  '''(^|/)\.github/workflows/''',
  '''(^|/)README\.md$''',
  '''(^|/)server_test\.js$''',
]
regexes = [
  '''-----BEGIN PRIVATE KEY-----\\n\.\.\.''',
  '''ci-test-secret-that-is-longer-than-thirty-two-characters''',
  '''ci-encryption-key-that-is-longer-than-thirty-two-characters''',
]
